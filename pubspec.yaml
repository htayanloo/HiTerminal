name: hi_terminal
description: "Cross-platform terminal emulator with RTL/Persian support"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Terminal emulation
  xterm: ^4.0.0
  flutter_pty: ^0.4.2

  # State management
  flutter_riverpod: ^3.3.1

  # Desktop window management
  window_manager: ^0.4.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
